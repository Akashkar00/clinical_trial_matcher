version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build: .
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      GROQ_API_KEY:        ${GROQ_API_KEY}
      LANGSMITH_API_KEY:   ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT:   ${LANGSMITH_PROJECT:-clinical-trial-matcher}
      QDRANT_URL:          http://qdrant:6333
      LOG_LEVEL:           ${LOG_LEVEL:-INFO}
    ports:
      - "8501:8501"
    volumes:
      - ./tests:/app/tests:ro

volumes:
  qdrant_data:
